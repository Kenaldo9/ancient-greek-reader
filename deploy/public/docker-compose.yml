# The public site: the reader on the published copy of the database, reached
# only through Cloudflare Tunnel (deploy/README.md, "The public site"). The
# Raspberry Pi's deploy and deploy/publish.sh run it with
#   docker compose --env-file /opt/ancient-greek-reader/public/compose.env -f THIS
# which they write; without it compose stops, since every variable is required.
name: greek-public

services:
  # The same image as the private reader's (docker-compose.yml builds it), on
  # a read-only copy of the published database, with no API key and no .env.
  web:
    image: ancient-greek-reader:latest
    pull_policy: never
    command: ["web", "--host", "0.0.0.0", "--port", "8999"]
    user: "${PUBLIC_UID:?}:${PUBLIC_GID:?}"
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    # It writes nothing: the code and the database are read-only, /tmp is in
    # memory
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    volumes:
      - ${PUBLIC_SITE:?}:/data:ro
      - /etc/localtime:/etc/localtime:ro
    # No port on the Pi: cloudflared is the only way in, and the site network
    # has no way out
    networks: [site]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  # The way in: it connects out to Cloudflare and passes requests to web.
  # Started with the tunnel profile once tunnel.env holds the tunnel's token
  # (TUNNEL_TOKEN=…, deploy/tunnel.sh); until then nothing reaches the site.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ${PUBLIC_ROOT:?}/tunnel.env
    # Resolvers on the internet: the firewall keeps it off the home
    # network's DNS server and the tailnet's
    dns: [1.1.1.1, 1.0.0.1]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [site, out]
    depends_on: [web]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

networks:
  # web's and cloudflared's, with no way out. An internal network still
  # reaches the Pi itself, so the firewall (firewall.nft) knows this one by
  # its bridge's name too.
  site:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: greek-site
  # cloudflared's way to the internet. The firewall (firewall.nft) knows it
  # by its bridge's name and lets it reach the internet only, over IPv4; a
  # fixed subnet, so it never takes a range the home network might use.
  out:
    driver_opts:
      com.docker.network.bridge.name: greek-out
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.250.0/24
