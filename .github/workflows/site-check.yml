name: Site check

# After every deploy, and every hour, the public site is checked from
# outside, through Cloudflare (deploy/public/check_site.py): /version, the
# Library, every page in the sitemap and each text's start, with Interlinear
# off and on, and http:// sent on to https://. Opening every page also
# builds them into the site's page cache again after a deploy or a publish
# has emptied it, so readers don't wait for a book's first build: at once
# after a deploy; after a publish at the next scheduled run, which GitHub
# starts when it can (every few hours in practice), or at once with
# `gh workflow run site-check.yml`. GitHub emails a failed scheduled run to
# whoever last changed the schedule below, and a failed run after a deploy
# to whoever set the deploy off. It runs once the repository
# variable PUBLIC_SITE_URL holds the site's address; during the private
# preview the secrets CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET hold
# Cloudflare Access's service token. Setup: deploy/README.md, "The tunnel".

on:
  schedule:
    - cron: "23 * * * *"
  # When Test and deploy has finished on main: its deploy restarted the site
  workflow_run:
    workflows: [Test and deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the public site
    # After a deploy, only one that succeeded (a failed one has said so)
    if: >-
      vars.PUBLIC_SITE_URL != '' &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    # A run after a restart waits for the Pi to build every page (minutes);
    # the others find them kept
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/public/check_site.py
          sparse-checkout-cone-mode: false

      - name: Check the site
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 deploy/public/check_site.py "$PUBLIC_SITE_URL"
