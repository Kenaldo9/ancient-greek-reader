name: Site check

# Every hour the public site is checked from outside, through Cloudflare
# (deploy/public/check_site.py): /version, the Library, every page in the
# sitemap and each text's start, with Interlinear off and on, and http://
# sent on to https://. Opening every page also builds them into the site's
# page cache again after a deploy or a publish has emptied it, so readers
# don't wait for a book's first build. GitHub emails a failed run to
# whoever last changed the schedule below. It runs once the repository
# variable PUBLIC_SITE_URL holds the site's address; during the private
# preview the secrets CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET hold
# Cloudflare Access's service token. Setup: deploy/README.md, "The tunnel".

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the public site
    if: vars.PUBLIC_SITE_URL != ''
    runs-on: ubuntu-24.04
    # A run after a restart waits for the Pi to build every page (minutes);
    # the others find them kept
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/public/check_site.py
          sparse-checkout-cone-mode: false

      - name: Check the site
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 deploy/public/check_site.py "$PUBLIC_SITE_URL"
