name: Test and deploy

# Tests and a secret scan run on every push. On main, after they pass, the
# Pi pulls main, rebuilds and checks itself (deploy/deploy_pi.sh). Set the
# repository variable PI_DEPLOY_ENABLED to "true" to turn deploys on; any
# other value pauses them. Setup: deploy/README.md. The logs are public.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # httpx for the route tests (CLAUDE.md); without Playwright the browser
      # tests skip
      - name: Install dependencies
        run: pip install -r requirements.txt httpx

      - name: Run tests
        run: python -m pytest tests/ -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit, not just the last
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # --redact: a secret found is not printed into the public log
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  deploy:
    name: Deploy on the Pi
    needs: [test, secrets]
    if: github.ref == 'refs/heads/main' && vars.PI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      # One deploy at a time; a newer one waits instead of cutting off a
      # deploy halfway through a build.
      group: pi-deploy
      cancel-in-progress: false

    steps:
      - name: Prepare SSH key and pinned host key
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_KNOWN_HOSTS: ${{ secrets.PI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/pi_deploy_key
          printf '%s\n' "$PI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pi_deploy_key ~/.ssh/known_hosts

      - name: Resolve the Pi's name
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if getent hosts "$PI_HOST" >/dev/null; then
              exit 0
            fi
            echo "DNS lookup failed (attempt $attempt/6), retrying in 5 s"
            sleep 5
          done
          echo "Could not resolve PI_HOST"
          exit 1

      - name: Deploy
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_PORT: ${{ secrets.PI_PORT }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            # Retries cover a failed connection only (ssh exits 255); a
            # failed deploy is reported as it is.
            status=0
            ssh -i ~/.ssh/pi_deploy_key -p "${PI_PORT:-22}" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "${PI_USER:-gha-deploy}@$PI_HOST" \
              "sudo -n /opt/ancient-greek-reader/app/deploy/deploy_pi.sh --non-interactive" \
              || status=$?
            if [ "$status" -ne 255 ]; then
              exit "$status"
            fi
            echo "SSH connection failed (attempt $attempt/5), retrying in 8 s"
            sleep 8
          done
          exit 255
